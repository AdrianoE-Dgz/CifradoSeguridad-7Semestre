<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eli's Basic Decrypter</title>
    <script src="./script.js" defer></script>
    <script src="./caesar.js" defer></script>
    <script src="./atbash.js" defer></script>
    <script src="./decipher.js" defer></script>

    <link rel="stylesheet" href="style.css">

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="p-0 m-0" > 
    <div class="container-xl card p-4">
      <h3>Eli's Basic Caesar and Atbash</h3>

      <div class="mb-3">
        <label for="inputAlph" class="form-label">Cadena usada para cifrado:</label>
        <textarea id="inputAlph" class="form-control" rows="1"></textarea>
      </div>
      
      <nav class="nav nav-pills flex-column flex-sm-row mb-3">
        <a class="flex-sm-fill text-sm-center nav-link active" aria-current="page" data-bs-toggle="tab" href="#cipher-pane">Cifrado</a>
        <a class="flex-sm-fill text-sm-center nav-link" data-bs-toggle="tab" href="#decipher-pane">Decifrado</a>
      </nav>

      <div class="tab-content">
        <div id="cipher-pane" class="tab-pane show active fade">
          <div class="d-flex align-items-center justify-content-center mb-3 text-center" style="column-gap: 0.5rem;">
            <label class="form-check-label" id="cipher-type-caesar">Caesar</label>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" role="switch" id="cipher-type">
              <label class="form-check-label" id="cipher-type-atbash">Atbash</label>
            </div>
          </div>

           <div class="mb-3">
            <label for="inputResult" class="form-label">Texto a cifrar:</label>
            <textarea
              class="form-control"
              rows="4"
              id="initialText"
            ></textarea>
          </div>

          <div id="caesar-cipher-pane" class="row mb-3">
            <div class="col-12 col-lg-6">
              <label for="caesarLetter" class="form-label">
                Llave de Letra
              </label>
              <input
                type="text"
                class="form-control"
                id="caesarLetter"
                maxlength="1"
                value="A"
              />
            </div>

            <div class="col-12 col-lg-6">
              <label for="caesarShift" class="form-label">
                Valor de Shift
              </label>
              <input
                type="number"
                class="form-control"
                id="caesarShift"
                min="1"
                value="1"
              />
            </div>
          </div>
        </div>

        <div id="decipher-pane" class="tab-pane fade">
          <div class="mb-3">
            <label for="inputDecrypt" class="form-label">Texto a decifrar:</label>
            <textarea
              class="form-control"
              rows="4"
              id="inputDecrypt"
            ></textarea>
          </div>

          <div class="mb-3">
            <button id="doDecrypt" class="btn btn-primary w-100">Decifrar</button>
          </div>

          <div id="charDecrypt" class="row mb-3">
            <div class="col">
              <label for="typeDecrypt" class="form-label">
                Tipo de cifrado
              </label>
              <input
                type="text"
                class="form-control"
                id="typeDecrypt"
                readonly
                disabled
              />
            </div>

            <div id="shiftDecrypt-container" class="col-12 col-lg-6">
              <label for="shiftDecrypt" class="form-label">
                Valor de Shift probable
              </label>
              <input
                type="text"
                class="form-control"
                id="shiftDecrypt"
                readonly
                disabled
              />
            </div>
          </div>

        </div>

        <div class="mb-3">
          <label for="inputResult" class="form-label">Resultado</label>
          <textarea
            class="form-control"
            rows="4"
            id="inputResult"
            disabled
            readonly
          ></textarea>
        </div>
      </div>
    </div>
  </body>
</html>
